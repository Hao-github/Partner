[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gptpartner-ai-butler"
version = "0.1.0"
description = "A personal AI butler with CLI/QQ channels and interchangeable model providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1,<2",
    "websockets>=15,<18",
    "mcp>=2.3,<3",
    "anyio>=4.5,<5",
    "jsonschema>=4.20,<5",
    "httpx2>=2.16,<3",
]

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[project.scripts]
ai-butler = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ai_butler*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ai_butler", "main", "tests"]

[tool.pyright]
include = ["ai_butler", "main.py", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportDeprecated = "error"
